<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mock Interview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Standalone page for the mock interview with Gary. The round styles itself (js/mock.js). */
:root {
  color-scheme: light;
  --bg: #cfeaff;
  --cream: #fffaf0;
  --paper: #fff3dc;
  --ink: #2b2340;
  --muted: #6f6787;
  --blue: #3b8bff;
  --sun: #ffc93c;
  --mint: #2fbf7f;
  --red: #ff5a5a;
  --violet: #8b6cff;
  --f-head: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: linear-gradient(180deg, #ffe9c7, var(--bg) 45%, #e9dcff); color: var(--ink); font: 15px/1.5 var(--f-body); min-height: 100vh; }
main { padding: 16px max(16px, env(safe-area-inset-left, 0px)) 40px max(16px, env(safe-area-inset-right, 0px)); }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; max-width: 860px; margin: 0 auto 12px; }
.bar a, .bar button { font: 600 14px var(--f-head); color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 4px 12px; box-shadow: 0 3px 0 var(--ink); text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <span><a href="index.html">← The game</a> <a href="mock.html">Mock interviews</a></span>
    <button id="snd" type="button" aria-pressed="true">Sound: on</button>
  </div>
  <div id="mi-root"></div>
</main>
<script src="assets/game-icons.js"></script>
<script src="js/content.js"></script>
<script src="js/art.js"></script>
<script src="js/whiteboard-data.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/mock-typed.js"></script>
<script src="js/quiz.js"></script>
<script src="js/embed.js"></script>
<script src="js/mock.js"></script>
<script>
(function () {
  const b = document.getElementById('snd');
  let on = true;
  try { on = localStorage.getItem('sd-mock-sound') !== 'off'; } catch (e) { /* private mode */ }
  const set = () => { SD.mock.setSound(on); b.textContent = 'Sound: ' + (on ? 'on' : 'off'); b.setAttribute('aria-pressed', on); };
  b.onclick = () => { on = !on; try { localStorage.setItem('sd-mock-sound', on ? 'on' : 'off'); } catch (e) { /* private mode */ } set(); };
  set();
  // mock.html?p=url opens one problem straight away.
  const pid = new URLSearchParams(location.search).get('p');
  SD.mock.menu(document.getElementById('mi-root'), { pid: SD.mock.problems.some(p => p.id === pid) ? pid : null });
})();
</script>
</body>
</html>
